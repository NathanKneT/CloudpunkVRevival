name: Bug report
description: Something broken, looks wrong or makes you sick
labels: [bug]
body:
  - type: input
    id: headset
    attributes:
      label: Headset and how it's connected
      placeholder: PS VR2 with the PC adapter, Quest 3 with Virtual Desktop...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "0.3.0"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you were doing when it did.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drop `BepInEx/LogOutput.log` from the game folder here. A clip or a screenshot helps too.
